name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/imlib2-prefix/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/imlib2-prefix/lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gijsbers/imlib2
          ref: 1.12.6
          path: imlib2-src
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
      - name: Build headless Imlib2 1.12.6
        working-directory: imlib2-src
        run: |
          autoreconf -fi
          ./configure --prefix="${{ github.workspace }}/imlib2-prefix" \
            --without-x --disable-text --disable-filters --disable-progs \
            --without-avif --without-gif --without-heif --without-jpeg \
            --without-j2k --without-jxl --without-png --without-ps \
            --without-raw --without-svg --without-tiff --without-webp \
            --without-y4m --without-bz2 --without-lzma --without-zlib \
            --without-id3
          make --jobs=2
          make install
      - name: Install Nim dependencies
        run: nimble install --depsOnly -y
      - name: Run headless test
        run: nimble test
